armor_detector_node_cpp:
  ros__parameters:
    # ==================== 检测器 ====================
    detector:
      # 后端类型: "traditional"（传统轮廓检测）/ "yolo"（YOLO 神经网络）
      backend: "yolo"
      # 目标灯条颜色: "RED"/ "BLUE"
      target_color: "RED"

      # --------------- 角点修正 ---------------
      corner_correction:
        # 灯条修正方法:
        #   "none": 
        #   "fit_ellipse"      
        #   "min_area_rect"    
        #   "pca_gradient"    
        method: "pca_gradient"
        roi_scale: 1.25
        gray_threshold: 100
        max_endpoint_distance_px: 15.0
        geometry:
          enabled: true
          max_angle_diff_deg: 15.0
          min_length_ratio: 0.45
          min_x_diff_ratio: 0.45
          max_y_diff_ratio: 1.5
          min_distance_ratio: 0.05
          max_distance_ratio: 1.2
        light:
          min_contours_area: 30
          min_contours_ratio: 0.06
          max_contours_ratio: 0.5

      # --------------- 传统后端参数 ---------------
      traditional:
        preprocess:
          gray_threshold: 100
          color_threshold: 100
        light:
          min_contours_area: 30
          min_contours_ratio: 0.06
          max_contours_ratio: 0.5
        armor:
          max_angle_diff: 15.0
          min_length_ratio: 0.7
          min_x_diff_ratio: 0.75
          max_y_diff_ratio: 1.0
          max_distance_ratio: 0.8
          min_distance_ratio: 0.1
        number:
          model_path: "model/number_cnn.onnx"
          threshold: 0.5

      # --------------- YOLO 后端参数 ---------------
      yolo:
        model_path: "model/robot_0526.onnx"
        device: "CPU"
        input_size: 640
        score_threshold: 0.65
        nms_threshold: 0.45
        min_confidence: 0.65
        max_raw_candidates: 100
        use_roi: false
        roi:
          x: 0
          y: 0
          width: -1
          height: -1
    # ------------------- Pose ----------------------
    pose:
      # 位姿矫正方法:
      # "pose_only_ba_6dof",
      # "pose_only_ba_4dof_xyz",
      # "pose_only_ba_4dof_ypd",
      # "yaw_search",
      # "none"
      refine_method: "pose_only_ba_6dof"
    # ==================== Debug ====================
    debug:
      # OpenCV GUI 开关（false=无头模式，不显示窗口）``
      show: true
      # 是否通过 ROS service 控制 rosbag 播放
      rosbag_control: true
      rosbag_player_node: "/rosbag2_player"
      # 各阶段图层默认开关（数字键 1-7 切换）
      detect_stage_1: false         # 1键: 传统=预处理 / YOLO=letterbox
      detect_stage_2: false         # 2键: 传统=灯条 / YOLO=score过滤
      detect_stage_3: false         # 3键: 传统=装甲匹配 / YOLO=NMS结果
      detect_stage_4: false         # 4键: 传统=数字分类 / YOLO=后端最终输出
      corner_correction: false      # 6键: 角点修正对比（原始→修正）
      pose: true                    # 5键: /armor_markers 发布
      pose_refine: false            # 7键: Pose Refine 重投影角点
      result: true                  # 0键: 最终装甲板 X 标记

      pose_refine_csv:
        enabled: false
        root_dir: ""
        video: "manual"
      pose_refine_topic:
        enabled: true
      stats_interval: 50

    # ==================== 播放控制 ====================
    playback:
      # 播放模式: "realtime"（按时间播放）/ "step"（逐帧播放，auto_test 用）
      mode: "realtime"
      # 最大处理帧数（0=不限制）
      max_frames: 0
      # 处理完指定帧数后是否自动退出
      exit_on_complete: false
